name: Publish arm64 images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA to build
        required: true
        default: 047c81d1f93c53cad6074db9ad525bf37a541178

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/example-voting-app-${{ matrix.service }}:${{ inputs.ref }}-arm64
